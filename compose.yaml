
services:
  code-server:
    container_name: code-server

    image: code-server-dev:${BUILD_VERSION:-1.1.0}

    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-1.1.0}

    restart: unless-stopped

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}

      PASSWORD: ${PASSWD}
      SUDO_PASSWORD: ${SUDOPWD}

      PROXY_DOMAIN: ${PRXYDMN}
      DEFAULT_WORKSPACE: ${DEFAULT_WORKSPACE}

    volumes:
      - ${CSHOME}/config:/config

    networks:
      - cserver

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=cserver"

      # Main code-server interface
      - "traefik.http.routers.code-server.rule=Host(`cs.corridor9design.com`)"
      - "traefik.http.routers.code-server.entrypoints=web"
      - "traefik.http.routers.code-server.service=code-server"
      - "traefik.http.services.code-server.loadbalancer.server.port=8443"

      # Port-based development server proxy
      - "traefik.http.routers.code-server-ports.rule=HostRegexp(`^[0-9]+\\.cs\\.corridor9design\\.com$`)"
      - "traefik.http.routers.code-server-ports.entrypoints=web"
      - "traefik.http.routers.code-server-ports.service=code-server"

  forgejo:
    container_name: forgejo
    image: codeberg.org/forgejo/forgejo:17
    restart: unless-stopped

    environment:
      USER_UID: ${PUID}
      USER_GID: ${PGID}
      TZ: ${TZ}

      FORGEJO__database__DB_TYPE: sqlite3

      FORGEJO__server__DOMAIN: forgejo.cs.corridor9design.com
      FORGEJO__server__ROOT_URL: https://forgejo.cs.corridor9design.com/
      FORGEJO__server__HTTP_PORT: 3000

      # Git over HTTP(S); no separately exposed SSH service
      FORGEJO__server__DISABLE_SSH: "true"

      # Keep the instance private by default
      FORGEJO__service__DISABLE_REGISTRATION: "true"

    volumes:
      - forgejo-data:/data

    networks:
      - cserver

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=cserver"
      - "traefik.http.routers.forgejo.rule=Host(`forgejo.cs.corridor9design.com`)"
      - "traefik.http.routers.forgejo.entrypoints=web"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"

volumes:
  forgejo-data:

networks:
  cserver:
    external: true
